name: Build release packages

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Check JavaScript syntax
        run: |
          node --check static/js/app.js
          node --check static/js/articles.js
          node --check static/js/knowledge.js
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/backend-manager.cjs
          node --check desktop/screenshot-tool.cjs

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify release version contract
        shell: powershell
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$packageVersion") {
            throw "Tag ${{ github.ref_name }} does not match package version v$packageVersion"
          }

      - name: Install desktop toolchain
        run: npm ci

      - name: Build PyInstaller backend (onedir)
        shell: powershell
        run: ./packaging/build_backend.ps1

      - name: Verify backend bundle
        shell: powershell
        run: |
          $backendExe = "dist/backend/UroPUCBackend/UroPUCBackend.exe"
          if (-not (Test-Path $backendExe)) {
            throw "Backend executable missing: $backendExe"
          }
          $seed = "dist/backend/UroPUCBackend/_internal/data/seed/manifest.json"
          if (-not (Test-Path $seed)) {
            throw "Public seed data missing from backend bundle"
          }
          $internal = "dist/backend/UroPUCBackend/_internal"
          foreach ($required in @("templates", "static", "data/knowledge_base.xlsx")) {
            if (-not (Test-Path (Join-Path $internal $required))) {
              throw "Backend bundle missing: $required"
            }
          }

      - name: Build Electron installer (NSIS)
        run: npx electron-builder --win nsis

      - name: Verify installer and packaged app
        shell: powershell
        run: |
          $setup = Get-ChildItem "dist/desktop/UroPUC-Setup-*.exe" -ErrorAction Stop | Select-Object -First 1
          Write-Host "Installer: $($setup.FullName) ($([math]::Round($setup.Length / 1MB, 1)) MB)"
          if ($setup.Length -lt 50MB) {
            throw "Installer looks too small; backend may be missing"
          }
          $unpackedBackend = "dist/desktop/win-unpacked/resources/backend/UroPUCBackend/UroPUCBackend.exe"
          if (-not (Test-Path $unpackedBackend)) {
            throw "Packaged app missing backend executable: $unpackedBackend"
          }
          # 安装包内不得出现私密数据
          $resources = "dist/desktop/win-unpacked/resources"
          $privateHits = Get-ChildItem $resources -Recurse -File |
            Where-Object { $_.Name -in @("api_config.json", "api_config_history.json", ".env", "deleted_cases.json", "case_label_overrides.json", "chat_history.json") }
          if ($privateHits) {
            throw "Private data leaked into installer: $($privateHits.FullName -join ', ')"
          }

      - name: Build legacy release packages
        shell: powershell
        run: ./scripts/build_release_packages.ps1 -Version "${{ github.ref_name }}"

      - name: Verify bundled public database
        shell: powershell
        run: |
          $manifest = Get-Content data/seed/manifest.json | ConvertFrom-Json
          if ($manifest.case_count -ne 93 -or $manifest.article_count -ne 230) {
            throw "Unexpected public database counts"
          }
          if ((Test-Path data/api_config.json) -or (Test-Path data/api_config_history.json)) {
            throw "Private API configuration must not be published"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead("dist/UroPUC-windows.zip")
          $names = @($zip.Entries | ForEach-Object { $_.FullName.Replace("\", "/") })
          $zip.Dispose()
          if ("AI-for-medical-science/UroPUC.exe" -notin $names) {
            throw "Windows release ZIP must contain AI-for-medical-science/UroPUC.exe"
          }
          foreach ($required in @(
            "AI-for-medical-science/data/seed/manifest.json",
            "AI-for-medical-science/data/seed/user_cases.json",
            "AI-for-medical-science/data/seed/articles.json"
          )) {
            if ($required -notin $names) { throw "Missing release file: $required" }
          }
          if ($names -match "(^|/)(api_config(_history)?\.json|\.env)$") {
            throw "Private configuration found in release package"
          }

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem "dist/desktop/UroPUC-Setup-*.exe" | Select-Object -First 1).FullName
          gh release create "${{ github.ref_name }}" `
            $setup `
            dist/UroPUC-windows.zip `
            dist/UroPUC-macos.tar.gz `
            dist/UroPUC-linux.tar.gz `
            dist/UroPUC.exe `
            --repo "${{ github.repository }}" `
            --title "UroPUC ${{ github.ref_name }}" `
            --generate-notes
